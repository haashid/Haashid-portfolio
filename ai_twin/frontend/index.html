<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My AI Twin — Chat with Me</title>
  <meta name="description" content="An AI that knows everything about me and talks just like me. Ask me anything — career, projects, opinions, and more." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    /* ─── CSS Reset & Root Tokens ─────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-deep:      #080c14;
      --bg-base:      #0d1220;
      --bg-card:      #111827;
      --bg-message:   #151e2e;
      --border:       rgba(99, 120, 180, 0.15);
      --border-glow:  rgba(99, 120, 255, 0.35);

      --accent-1:     #6366f1;   /* indigo */
      --accent-2:     #8b5cf6;   /* violet */
      --accent-3:     #06b6d4;   /* cyan */
      --accent-grad:  linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #06b6d4 100%);

      --text-primary:   #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted:     #475569;

      --user-bubble:    linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      --ai-bubble:      #161f31;

      --font-head: 'Space Grotesk', sans-serif;
      --font-body: 'Inter', sans-serif;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-xl: 28px;
      --shadow-glow: 0 0 40px rgba(99, 102, 241, 0.15);
      --transition: 0.22s cubic-bezier(0.4, 0, 0.2, 1);
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg-deep);
      color: var(--text-primary);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ─── Background Orbs ─────────────────────────────────────────────── */
    .bg-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.35;
    }
    .bg-orb-1 {
      width: 600px; height: 600px;
      background: radial-gradient(circle, #4f46e5 0%, transparent 70%);
      top: -200px; left: -200px;
      animation: orb-float 12s ease-in-out infinite;
    }
    .bg-orb-2 {
      width: 500px; height: 500px;
      background: radial-gradient(circle, #7c3aed 0%, transparent 70%);
      bottom: -150px; right: -150px;
      animation: orb-float 15s ease-in-out infinite reverse;
    }
    .bg-orb-3 {
      width: 300px; height: 300px;
      background: radial-gradient(circle, #0891b2 0%, transparent 70%);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      animation: orb-float 10s ease-in-out infinite 3s;
      opacity: 0.15;
    }
    @keyframes orb-float {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-30px) scale(1.05); }
    }

    /* ─── Layout ──────────────────────────────────────────────────────── */
    .app-wrapper {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 820px;
      margin: 0 auto;
      width: 100%;
      padding: 0 16px;
    }

    /* ─── Header ──────────────────────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 20px 0 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .avatar-ring {
      position: relative;
      width: 52px; height: 52px;
      flex-shrink: 0;
    }
    .avatar-ring::before {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      background: var(--accent-grad);
      animation: spin 4s linear infinite;
      z-index: 0;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .avatar-inner {
      position: relative;
      z-index: 1;
      width: 100%; height: 100%;
      border-radius: 50%;
      background: var(--bg-card);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 700;
      font-family: var(--font-head);
      background: linear-gradient(135deg, #1e2a45 0%, #0d1220 100%);
      border: 2px solid var(--bg-deep);
      letter-spacing: -0.5px;
    }
    .avatar-status {
      position: absolute;
      bottom: 1px; right: 1px;
      width: 13px; height: 13px;
      background: #22c55e;
      border-radius: 50%;
      border: 2px solid var(--bg-deep);
      z-index: 2;
      box-shadow: 0 0 8px rgba(34, 197, 94, 0.6);
    }

    .header-info { flex: 1; min-width: 0; }
    .header-name {
      font-family: var(--font-head);
      font-size: 1.15rem;
      font-weight: 700;
      background: var(--accent-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .header-tagline {
      font-size: 0.78rem;
      color: var(--text-secondary);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #4ade80;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .header-badge .dot {
      width: 6px; height: 6px;
      background: #22c55e;
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }

    /* ─── Chat Window ─────────────────────────────────────────────────── */
    .chat-window {
      flex: 1;
      overflow-y: auto;
      padding: 24px 0;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
    }
    .chat-window::-webkit-scrollbar { width: 4px; }
    .chat-window::-webkit-scrollbar-track { background: transparent; }
    .chat-window::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* ─── Welcome Card ────────────────────────────────────────────────── */
    .welcome-card {
      background: linear-gradient(135deg, rgba(99,102,241,0.08) 0%, rgba(139,92,246,0.06) 100%);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 28px;
      text-align: center;
      animation: fade-in 0.6s ease;
    }
    .welcome-card h1 {
      font-family: var(--font-head);
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 8px;
      background: var(--accent-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .welcome-card p {
      color: var(--text-secondary);
      font-size: 0.9rem;
      line-height: 1.65;
      max-width: 480px;
      margin: 0 auto 20px;
    }
    .starters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }
    .starter-btn {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 0.78rem;
      font-family: var(--font-body);
      padding: 7px 14px;
      border-radius: 999px;
      cursor: pointer;
      transition: all var(--transition);
    }
    .starter-btn:hover {
      background: rgba(99,102,241,0.12);
      border-color: var(--border-glow);
      color: var(--text-primary);
      transform: translateY(-1px);
    }

    /* ─── Message Row ─────────────────────────────────────────────────── */
    .message-row {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      animation: msg-slide-in 0.3s ease;
    }
    @keyframes msg-slide-in {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .message-row.user { flex-direction: row-reverse; }

    .msg-avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      flex-shrink: 0;
      font-family: var(--font-head);
    }
    .msg-avatar.ai {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
    }
    .msg-avatar.user {
      background: rgba(99,102,241,0.2);
      border: 1px solid var(--border-glow);
      color: var(--accent-1);
    }

    .msg-content { max-width: 78%; display: flex; flex-direction: column; gap: 5px; }
    .message-row.user .msg-content { align-items: flex-end; }

    .bubble {
      padding: 13px 17px;
      border-radius: var(--radius-lg);
      font-size: 0.9rem;
      line-height: 1.7;
      position: relative;
      word-break: break-word;
    }
    .bubble.ai {
      background: var(--ai-bubble);
      border: 1px solid var(--border);
      border-bottom-left-radius: var(--radius-sm);
      color: var(--text-primary);
    }
    .bubble.user {
      background: var(--user-bubble);
      border-bottom-right-radius: var(--radius-sm);
      color: white;
      box-shadow: 0 4px 20px rgba(99,102,241,0.3);
    }

    .msg-meta {
      font-size: 0.68rem;
      color: var(--text-muted);
      padding: 0 4px;
    }

    .sources-tag {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 6px;
    }
    .source-pill {
      background: rgba(6,182,212,0.08);
      border: 1px solid rgba(6,182,212,0.2);
      color: #67e8f9;
      font-size: 0.65rem;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 500;
    }

    /* ─── Typing Indicator ────────────────────────────────────────────── */
    .typing-indicator {
      display: none;
      align-items: flex-end;
      gap: 10px;
      animation: msg-slide-in 0.3s ease;
    }
    .typing-indicator.active { display: flex; }
    .typing-bubble {
      background: var(--ai-bubble);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      border-bottom-left-radius: var(--radius-sm);
      padding: 14px 18px;
      display: flex;
      gap: 5px;
      align-items: center;
    }
    .typing-dot {
      width: 7px; height: 7px;
      background: var(--text-muted);
      border-radius: 50%;
      animation: bounce 1.2s ease-in-out infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-6px); opacity: 1; }
    }

    /* ─── Input Area ──────────────────────────────────────────────────── */
    .input-area {
      flex-shrink: 0;
      padding: 16px 0 20px;
      border-top: 1px solid var(--border);
    }
    .input-wrapper {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 10px 10px 10px 18px;
      transition: border-color var(--transition), box-shadow var(--transition);
    }
    .input-wrapper:focus-within {
      border-color: var(--border-glow);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.1), var(--shadow-glow);
    }

    #message-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: 0.92rem;
      resize: none;
      max-height: 160px;
      min-height: 24px;
      line-height: 1.6;
      padding: 0;
    }
    #message-input::placeholder { color: var(--text-muted); }
    #message-input::-webkit-scrollbar { width: 3px; }
    #message-input::-webkit-scrollbar-thumb { background: var(--border); }

    .send-btn {
      width: 40px; height: 40px;
      border-radius: 50%;
      border: none;
      background: var(--accent-grad);
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all var(--transition);
      box-shadow: 0 4px 15px rgba(99,102,241,0.4);
    }
    .send-btn:hover { transform: scale(1.08); box-shadow: 0 6px 20px rgba(99,102,241,0.6); }
    .send-btn:active { transform: scale(0.95); }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    .send-btn svg { width: 18px; height: 18px; }

    .input-hint {
      text-align: center;
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 10px;
    }

    /* ─── Utilities ───────────────────────────────────────────────────── */
    @keyframes fade-in {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Prose formatting in AI responses */
    .bubble.ai strong { color: #a5b4fc; }
    .bubble.ai em { color: #c4b5fd; }
    .bubble.ai ul, .bubble.ai ol { margin: 8px 0 8px 18px; }
    .bubble.ai li { margin-bottom: 4px; }
    .bubble.ai p + p { margin-top: 8px; }

    /* ─── Responsive ──────────────────────────────────────────────────── */
    @media (max-width: 600px) {
      .msg-content { max-width: 90%; }
      .starters { gap: 6px; }
      .header-badge { display: none; }
    }
  </style>
</head>
<body>
  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>
  <div class="bg-orb bg-orb-3"></div>

  <div class="app-wrapper">
    <!-- Header -->
    <header>
      <div class="avatar-ring">
        <div class="avatar-inner" id="avatar-initials">AI</div>
        <div class="avatar-status"></div>
      </div>
      <div class="header-info">
        <div class="header-name" id="header-name">Loading…</div>
        <div class="header-tagline" id="header-tagline">AI Twin</div>
      </div>
      <div class="header-badge">
        <span class="dot"></span>
        Online
      </div>
    </header>

    <!-- Chat Window -->
    <div class="chat-window" id="chat-window">
      <!-- Welcome card inserted by JS -->
    </div>

    <!-- Typing Indicator (hidden by default) -->
    <div class="typing-indicator" id="typing-indicator">
      <div class="msg-avatar ai" id="typing-avatar">AI</div>
      <div class="typing-bubble">
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
      </div>
    </div>

    <!-- Input Area -->
    <div class="input-area">
      <div class="input-wrapper">
        <textarea
          id="message-input"
          placeholder="Ask me anything — career, projects, opinions…"
          rows="1"
          maxlength="2000"
        ></textarea>
        <button class="send-btn" id="send-btn" title="Send message" aria-label="Send message">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
      <p class="input-hint">Press <kbd>Enter</kbd> to send · <kbd>Shift+Enter</kbd> for new line</p>
    </div>
  </div>

  <script>
    /* ─── Config ─────────────────────────────────────────────────────── */
    const API_BASE = 'http://localhost:8000';

    /* ─── State ──────────────────────────────────────────────────────── */
    let conversationHistory = [];
    let isLoading = false;
    let personName = 'My AI Twin';
    let personTagline = 'Your Personal AI';
    let personInitials = 'AI';

    /* ─── DOM References ─────────────────────────────────────────────── */
    const chatWindow   = document.getElementById('chat-window');
    const msgInput     = document.getElementById('message-input');
    const sendBtn      = document.getElementById('send-btn');
    const typingInd    = document.getElementById('typing-indicator');
    const headerName   = document.getElementById('header-name');
    const headerTag    = document.getElementById('header-tagline');
    const avatarEl     = document.getElementById('avatar-initials');
    const typingAvatar = document.getElementById('typing-avatar');

    const STARTER_QUESTIONS = [
      '👋 Tell me about yourself',
      '💼 What are your top skills?',
      '🚀 What projects are you most proud of?',
      '🎯 What are you currently working on?',
      '💪 What\'s your biggest strength?',
      '🌱 Where do you see yourself in 5 years?',
      '🤔 What\'s your biggest weakness?',
      '💡 What motivates you at work?',
    ];

    /* ─── Init ───────────────────────────────────────────────────────── */
    async function init() {
      try {
        const res = await fetch(`${API_BASE}/info`);
        if (res.ok) {
          const data = await res.json();
          personName    = data.name    || 'My AI Twin';
          personTagline = data.tagline || 'Powered by AI';
          personInitials = personName.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
        }
      } catch (_) { /* server not running yet, show defaults */ }

      headerName.textContent = personName;
      headerTag.textContent  = personTagline;
      avatarEl.textContent   = personInitials;
      typingAvatar.textContent = personInitials;
      document.title         = `Chat with ${personName} — AI Twin`;

      renderWelcomeCard();
    }

    /* ─── Welcome Card ───────────────────────────────────────────────── */
    function renderWelcomeCard() {
      const card = document.createElement('div');
      card.className = 'welcome-card';
      card.id = 'welcome-card';
      card.innerHTML = `
        <h1>Hey, I'm ${personName}'s AI Twin 👋</h1>
        <p>${personTagline}<br>
        Ask me anything — career, projects, experiences, opinions, or anything you'd ask me in person.</p>
        <div class="starters">
          ${STARTER_QUESTIONS.map(q => `
            <button class="starter-btn" onclick="sendStarter(this)" data-q="${q.replace(/^[^\s]+ /, '')}">
              ${q}
            </button>`).join('')}
        </div>
      `;
      chatWindow.appendChild(card);
    }

    function sendStarter(btn) {
      msgInput.value = btn.getAttribute('data-q');
      send();
    }

    /* ─── Append Messages ────────────────────────────────────────────── */
    function appendMessage(role, text, sources = []) {
      const row = document.createElement('div');
      row.className = `message-row ${role}`;

      const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      const avatarChar = role === 'ai' ? personInitials : 'You';
      const avatarLabel = role === 'ai' ? personInitials : '👤';

      const sourcesHTML = sources.length
        ? `<div class="sources-tag">${sources.map(s => `<span class="source-pill">${s}</span>`).join('')}</div>`
        : '';

      row.innerHTML = `
        <div class="msg-avatar ${role}">${avatarLabel}</div>
        <div class="msg-content">
          <div class="bubble ${role}">${formatText(text)}</div>
          ${role === 'ai' ? sourcesHTML : ''}
          <div class="msg-meta">${now}</div>
        </div>
      `;
      chatWindow.appendChild(row);
      scrollToBottom();
      return row;
    }

    /* Basic markdown-like formatting */
    function formatText(text) {
      return text
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.*?)\*/g, '<em>$1</em>')
        .replace(/`(.*?)`/g, '<code style="background:rgba(255,255,255,0.07);padding:1px 5px;border-radius:4px;font-size:0.85em">$1</code>')
        .replace(/\n/g, '<br>');
    }

    /* ─── Send Message ───────────────────────────────────────────────── */
    async function send() {
      const text = msgInput.value.trim();
      if (!text || isLoading) return;

      // Remove welcome card
      const card = document.getElementById('welcome-card');
      if (card) card.remove();

      msgInput.value = '';
      adjustTextarea();
      setLoading(true);

      appendMessage('user', text);
      conversationHistory.push({ role: 'user', content: text });

      typingInd.classList.add('active');
      chatWindow.appendChild(typingInd);
      scrollToBottom();

      try {
        const res = await fetch(`${API_BASE}/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: text,
            history: conversationHistory.slice(-10).map(h => ({
              role: h.role === 'ai' ? 'model' : 'user',
              content: h.content,
            })),
          }),
        });

        typingInd.classList.remove('active');

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          appendMessage('ai', `⚠️ Oops — ${err.detail || 'Something went wrong. Make sure the backend is running!'}`, []);
          return;
        }

        const data = await res.json();
        appendMessage('ai', data.reply, data.sources || []);
        conversationHistory.push({ role: 'ai', content: data.reply });

      } catch (err) {
        typingInd.classList.remove('active');
        appendMessage('ai', `⚠️ Can't reach the server. Make sure you've started the backend with:\n\n\`uvicorn main:app --reload\`\n\nSee the README for setup instructions.`, []);
      } finally {
        setLoading(false);
      }
    }

    /* ─── Helpers ────────────────────────────────────────────────────── */
    function setLoading(val) {
      isLoading = val;
      sendBtn.disabled = val;
      msgInput.disabled = val;
    }

    function scrollToBottom() {
      requestAnimationFrame(() => {
        chatWindow.scrollTop = chatWindow.scrollHeight;
      });
    }

    function adjustTextarea() {
      msgInput.style.height = 'auto';
      msgInput.style.height = Math.min(msgInput.scrollHeight, 160) + 'px';
    }

    /* ─── Event Listeners ────────────────────────────────────────────── */
    sendBtn.addEventListener('click', send);

    msgInput.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });

    msgInput.addEventListener('input', adjustTextarea);

    /* ─── Boot ───────────────────────────────────────────────────────── */
    init();
  </script>
